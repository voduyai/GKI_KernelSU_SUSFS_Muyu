name: 'Setup Networking'
description: 'Set up all networking options (IP Set, TCP CC, Qdisc, BBRv3, CIFS, Wireguard)'
inputs:
  version:
    description: 'Kernel config version (e.g., android15-6.6)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Kernel sublevel'
    required: true
  os_patch_level:
    description: 'OS patch level ("lts" selects the lts variant patches when present)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Setup Networking Configs
      uses: ./.github/actions/networking-config

    - name: Apply BBRv3 Patches
      uses: ./.github/actions/bbrv3
      with:
        version: ${{ inputs.version }}
        kernel_version: ${{ inputs.kernel_version }}
        sublevel: ${{ inputs.sublevel }}
        os_patch_level: ${{ inputs.os_patch_level }}

    # muyu (android14-6.1) ships cifs_arc4.ko, cifs_md4.ko, cifs.ko and
    # dns_resolver.ko in vendor_boot's first-stage modules.load. Building CIFS
    # into the kernel makes those loads fail ("exports duplicate symbol") and
    # first-stage init aborts the boot, so keep CIFS as the vendor's modules.
    - name: Setup CIFS Configs
      if: inputs.version != 'android14-6.1'
      uses: ./.github/actions/cifs
      with:
        version: ${{ inputs.version }}
